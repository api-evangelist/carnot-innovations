aid: carnot-innovations
name: Carnot Innovations
description: Carnot Innovations is a Hong Kong-based building energy management company
  that applies AI, machine learning, and advanced data analytics to optimize HVAC systems
  and reduce energy consumption across commercial buildings, data centers, hospitals,
  railways, and sewage treatment facilities in the Asia-Pacific region. Its platform delivers
  AI-driven energy optimization, predictive maintenance and fault detection for chillers,
  pumps, cooling towers, and air handling units, analytics dashboards for facility managers,
  and continuous commissioning insights, reporting outcomes such as 15% energy cost reductions,
  90% hidden-fault detection, and 15 million kWh per year of energy savings across its deployment
  portfolio. It is a portfolio company of 500 Global. Carnot Innovations does not currently
  publish a public developer program or API; this profile exists in the API Evangelist network
  for discovery and enrichment.
